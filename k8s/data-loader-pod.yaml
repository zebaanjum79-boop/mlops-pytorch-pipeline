apiVersion: v1
kind: Pod
metadata:
  name: data-loader
  namespace: ml-training
spec:
  containers:
    - name: loader
      image: busybox
      command: ["sleep", "3600"]
      volumeMounts:
        - name: data-volume
          mountPath: /app/data
  volumes:
    - name: data-volume
      persistentVolumeClaim:
        claimName: data-pvc
  restartPolicy: Never